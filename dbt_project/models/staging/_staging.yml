version: 2

models:
  - name: stg_orders
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: user_id
        tests: [not_null]
      - name: eval_set
        tests:
          - accepted_values:
              values: ["prior", "train", "test"]
      - name: order_dow
        tests:
          - accepted_values:
              values: [0, 1, 2, 3, 4, 5, 6]
              quote: false

  - name: stg_products
    columns:
      - name: product_id
        tests: [unique, not_null]
      - name: department
        tests: [not_null]

  - name: stg_order_products
    columns:
      - name: order_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_orders')
              field: order_id
      - name: product_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_products')
              field: product_id
      - name: reordered
        tests:
          - accepted_values:
              values: [0, 1]
              quote: false
